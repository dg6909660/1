name: The News Detail Auto Poster

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      BLOG_ID: ${{ secrets.BLOG_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache local AI models
        uses: actions/cache@v4
        with:
          path: ~/ollama-models
          key: ollama-models-qwen3b-llama3b-gemma2b-phi35-v1

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          sudo systemctl disable ollama || true

      - name: Start Ollama and pull models
        run: |
          mkdir -p $HOME/ollama-models
          export OLLAMA_MODELS=$HOME/ollama-models
          export OLLAMA_KEEP_ALIVE=30m
          export OLLAMA_MAX_LOADED_MODELS=2
          export OLLAMA_NUM_PARALLEL=1
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          for m in qwen2.5:3b llama3.2:3b gemma2:2b phi3.5; do ollama pull "$m"; done

      - name: Run news bot
        timeout-minutes: 27
        run: python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data || true
          git diff --cached --quiet || (git commit -m "bot: update state" && git pull --rebase && git push)
